[project]
name = "aspeed-agent"
version = "0.1.0"
description = "ASpeed：研发团队共享上下文与任务驱动 Agent 的确定性控制层"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2.7",
    "pyyaml>=6.0",
    "tzdata>=2024.1",
]

[project.scripts]
aspeed = "aspeed.cli:main"

[dependency-groups]
dev = ["pytest>=8"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/aspeed"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
